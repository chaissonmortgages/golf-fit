<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swing Fit">
<meta name="theme-color" content="#0a0f0c">
<meta name="robots" content="noindex, nofollow">
<title>Swing Fit</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0a0f0c;--card:#131b16;--card2:#1a251e;--line:#24322a;--text:#eef3ef;--muted:#8a9c91;
  --green:#3fd47a;--green-d:#1f6b3f;--yellow:#f5c84c;--red:#ef6b5b;--accent:#3fd47a;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--text)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.wrap{padding:calc(var(--safe-t) + 18px) 18px calc(var(--safe-b) + 96px);max-width:560px;margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 16px;border-radius:14px;background:var(--green);color:#06210f;font-weight:700;font-size:17px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:10px 12px;font-size:15px;border-radius:12px;width:auto}
.btn.danger{background:transparent;color:var(--red);border:1px solid #4a2723}
.btn[disabled]{opacity:.4}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.pill.g{color:var(--green);border-color:var(--green-d)}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hello{font-size:28px}
.list-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0}
.list-btn .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none}
.list-btn h3{font-size:17px}
.chev{color:var(--muted);font-size:22px}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(12,18,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(var(--safe-b) + 6px);z-index:5}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted)}
.tabbar button.on{color:var(--green)}
.tabbar svg{width:24px;height:24px}
/* quiz */
.quiz{min-height:100vh;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 18px) 20px calc(var(--safe-b) + 20px);max-width:560px;margin:0 auto}
.bar{height:5px;background:var(--card2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .3s}
.qtitle{font-size:26px;margin:28px 0 18px;line-height:1.2}
.opt{display:block;width:100%;text-align:left;padding:16px;margin:10px 0;border-radius:15px;background:var(--card);border:1.5px solid var(--line)}
.opt b{display:block;font-size:17px}
.opt span{color:var(--muted);font-size:14px}
.opt.on{border-color:var(--green);background:#12251a}
.field{width:100%;padding:16px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:20px;outline:none}
.field:focus{border-color:var(--green)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#0f1612;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 18px calc(var(--safe-b) + 20px);animation:up .25s ease-out}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 0;width:calc((100% - 48px)/7);text-align:center;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--green);color:#06210f;border-color:var(--green)}
.inp{padding:12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);width:100%;font-size:17px;outline:none;-webkit-appearance:none;appearance:none;min-height:48px}
label.lbl{display:block;margin:18px 0 8px;font-weight:600}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 6px;text-align:center}
.cal .dow{font-size:12px;color:var(--muted);font-weight:600}
.bub{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;background:#000;border:1.5px solid #1c2620;color:#6f8077;width:100%;max-width:46px;margin:0 auto}
.bub.done{background:var(--green);border-color:var(--green);color:#06210f}
.bub.missed{background:var(--yellow);border-color:var(--yellow);color:#2a2000}
.bub.planned{border:2px dashed #5b6e62;color:var(--text)}
.bub.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #ffffff55}
.bub.out{visibility:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}
/* player */
.player{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column}
.p-top{padding:calc(var(--safe-t) + 8px) 14px 10px;border-bottom:1px solid var(--line);background:#0c1310}
.clock{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.p-x{width:40px;height:40px;border-radius:12px;background:var(--card2);font-size:20px;display:grid;place-items:center}
.dots{display:flex;gap:4px;margin-top:10px}
.dots i{flex:1;height:6px;border-radius:9px;background:#e9f1ec;cursor:pointer}
.dots i.d{background:var(--green)}
.dots i.c{background:var(--yellow)}
.p-nav .btn.navb{flex:0 0 58px;width:58px;font-size:26px;padding:10px 0}
.dots i{height:20px;padding:7px 0;background-clip:content-box}
.rest{margin-top:10px;display:flex;align-items:center;gap:10px;background:#2a2410;border:1px solid #5a4a15;color:var(--yellow);padding:8px 12px;border-radius:12px;font-weight:700}
.rest .tr{flex:1;height:5px;background:#3d3414;border-radius:9px;overflow:hidden}
.rest .tr i{display:block;height:100%;background:var(--yellow)}
.p-body{flex:1;overflow:auto;padding:16px 16px 20px;-webkit-overflow-scrolling:touch}
.p-name{font-size:25px;line-height:1.15}
.diagram{background:radial-gradient(120% 90% at 50% 10%,#17241c,#0e1611);border:1px solid var(--line);border-radius:18px;margin:14px 0;padding:6px;display:flex;justify-content:center}
.diagram svg{width:100%;max-width:300px;max-height:30vh;height:auto;display:block}
.cues{margin:0;padding-left:20px;color:#cfdad3}
.cues li{margin:5px 0}
.sets{margin:16px 0 6px}
.sethead,.setrow{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:8px;align-items:center}
.sets.nw .sethead,.sets.nw .setrow{grid-template-columns:34px 1fr 52px}
.sethead{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:0 2px 6px}
.setrow{margin:8px 0}
.setrow .n{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
.setrow input{width:100%;padding:12px 8px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);text-align:center;font-size:19px;font-weight:700;outline:none}
.setrow input:focus{border-color:var(--green)}
.setrow input::placeholder{color:#55665c;font-weight:600}
.ck{width:52px;height:48px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);display:grid;place-items:center;font-size:22px;color:var(--muted)}
.setrow.ok .ck{background:var(--green);border-color:var(--green);color:#06210f}
.setrow.ok input{border-color:var(--green-d);background:#102018}
.setrow.ok .n{background:var(--green-d);color:#cfeedd}
.tbtn{width:100%;padding:12px 8px;border-radius:12px;background:#12251a;border:1.5px solid var(--green-d);color:var(--green);font-weight:700;font-size:16px}
.tbtn.run{background:var(--yellow);color:#2a2000;border-color:var(--yellow)}
.addset{color:var(--green);font-weight:600;padding:8px 0;font-size:15px}
.yt{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);text-decoration:none;font-weight:600;margin-top:16px}
.p-nav{display:flex;gap:10px;padding:10px 14px calc(var(--safe-b) + 10px);border-top:1px solid var(--line);background:#0c1310}
.p-nav .btn{flex:1}
/* diagram figure */
.fig .limb{stroke:#e9f1ec;stroke-width:4.2;stroke-linecap:round}
.fig .limb.bk{stroke:#7f948a}
.fig .torso{stroke:#e9f1ec;stroke-width:5.5;stroke-linecap:round}
.fig .head{fill:#e9f1ec}
.fig .ground{stroke:#2c3b32;stroke-width:1.5}
.fig .band{stroke:#ff8a3d;stroke-width:2;stroke-dasharray:3 2.5;fill:none}
.fig .cable{stroke:#9fb3a8;stroke-width:1.6}
.fig .pulley{fill:#34463b}
.fig .wt{stroke:#3fd47a;stroke-width:6;stroke-linecap:round}
.fig .ball{fill:#3fd47a}
.fig .plate{fill:none;stroke:#3fd47a;stroke-width:3.5}
.fig .club{stroke:#c8d1cc;stroke-width:1.8;stroke-linecap:round}
.fig .furn{fill:#23322a;stroke:#3a4c41;stroke-width:1}
.fig .bar2{stroke:#3fd47a;stroke-width:3;stroke-linecap:round}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translateX(-50%);background:#eef3ef;color:#0a0f0c;padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;font-size:15px;animation:fade .2s;max-width:90vw;text-align:center}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.hist-ex{padding:8px 0;border-top:1px solid var(--line)}
.hist-ex:first-child{border-top:0}
.sug{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:12px;background:var(--card2);color:var(--muted)}
.sug.up{background:#12251a;color:var(--green);font-weight:600}
.setrow.pr .n{background:var(--yellow);color:#2a2000}
.bub{position:relative}
.bub.rd::after{content:'';position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--card)}
.bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 6px;margin:12px 0 22px}
.bd{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0}
.medal{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.10),inset 0 -5px 0 rgba(0,0,0,.18)}
.medal svg{width:28px;height:28px;stroke:#0a0f0c;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bd.lock .medal{background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--line)}
.bd.lock .medal svg{stroke:#4d5d53}
.bn{font-size:11.5px;line-height:1.2}
.bd.lock .bn{color:var(--muted)}
.medal.big{width:100px;height:100px;margin:6px auto 12px}
.medal.big svg{width:48px;height:48px}
.pbar{height:7px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--green)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;margin:12px 0}
.chart svg{display:block;width:100%;height:auto}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.exc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 8px;margin:0 0 12px}
.exc.alldone{border-color:var(--green-d)}
.exn{font-size:19px;line-height:1.2}
.exc .sets{margin:10px 0 0}
.exc .sug{margin-top:8px}
.howbtn{font-size:13px;font-weight:600;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:99px;flex:none}
.allbtn{font-size:14px;font-weight:700;color:var(--green);padding:8px 12px;border:1px solid var(--green-d);border-radius:12px}
.allbtn[disabled]{color:var(--muted);border-color:var(--line)}
.guide-h{display:flex;align-items:center;gap:10px;margin:26px 0 12px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.guide-h::before,.guide-h::after{content:'';flex:1;height:1px;background:var(--line)}
.guide{padding:6px 0 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.guide .diagram svg{max-height:24vh}
.guide .yt{margin-top:10px}
.pvrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pvrow:first-child{border-top:0}
.pvn{width:26px;height:26px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:none}
.icb{width:38px;height:38px;border-radius:11px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;color:var(--muted);flex:none}
.icb.rm{color:var(--red)}
.srch{display:flex;align-items:center;gap:8px;margin-top:14px;padding:0 12px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);color:var(--muted)}
.srch:focus-within{border-color:var(--green)}
.srch input{flex:1;border:0;background:none;outline:none;padding:13px 0;font-size:17px;-webkit-appearance:none;appearance:none}
.res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.res .plus{width:34px;height:34px;border-radius:50%;background:var(--green);color:#06210f;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.res[disabled] .plus{background:none;color:var(--muted);font-size:13px;width:auto}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
/* Swing Fit: golf fitness tracker. All data stays on this phone (localStorage). */

const APP_BUILD='__BUILD__';
/* ---------- storage ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem('sf_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('sf_'+k,JSON.stringify(v))}catch(e){}}
};
const S={profile:store.get('profile',null),plans:store.get('plans',[]),logs:store.get('logs',[]),active:store.get('active',null),rounds:store.get('rounds',[]),badges:store.get('badges',{}),archive:store.get('archive',[]),custom:store.get('custom',{})};
function save(){store.set('profile',S.profile);store.set('plans',S.plans);store.set('logs',S.logs);store.set('active',S.active);store.set('rounds',S.rounds);store.set('badges',S.badges);store.set('archive',S.archive);store.set('custom',S.custom)}

/* ---------- helpers ---------- */
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const ICSDAY=['SU','MO','TU','WE','TH','FR','SA'];
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pkey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const todayKey=()=>dkey(new Date());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmtDate=k=>pkey(k).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const mmss=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+pad(m):m)+':'+pad(x)};
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- stick figure poses ----------
   Joints: head, neck, hip, back knee, back foot, front knee, front foot,
   back elbow, back hand, front elbow, front hand. Ground is y=110. */
const J=['hd','nk','hp','kL','fL','kR','fR','eL','hL','eR','hR'];
const POSE={};
const def=(n,a)=>{POSE[n]=a};
const mod=(b,ch)=>{const a=(typeof b==='string'?POSE[b]:b).slice();for(const k in ch){const i=J.indexOf(k);a[i*2]=ch[k][0];a[i*2+1]=ch[k][1]}return a};
const mirror=b=>POSE[b].map((v,i)=>i%2===0?100-v:v);
const shift=(b,dx,dy)=>POSE[b].map((v,i)=>i%2===0?v+dx:v+dy);
const F=(hx,arms)=>[hx,24,hx,35,50,62,42,84,36,109,58,84,64,109].concat(arms);
const FS=arms=>[50,20,50,31,50,61,45,85,43,109,55,85,57,109].concat(arms);

def('stand',[50,20,50,31,50,61,49,85,49,109,52,85,53,109,49,46,50,60,52,46,53,60]);
POSE.standUp=mod('stand',{eL:[47,16],hL:[46,2],eR:[53,16],hR:[54,2]});
POSE.standFwd=mod('stand',{eL:[64,33],hL:[79,33],eR:[65,34],hR:[80,34]});
POSE.standGob=mod('stand',{eL:[55,44],hL:[59,37],eR:[56,45],hR:[60,38]});
def('squatGob',[56,46,52,57,36,80,58,85,50,109,60,86,52,109,58,70,62,62,59,71,63,63]);
POSE.squatFwd=mod('squatGob',{eL:[66,57],hL:[81,57],eR:[67,58],hR:[82,58]});
POSE.squatFwd2=mod('squatFwd',{hd:[56,48],nk:[52,59],hp:[36,82]});
POSE.squatBack=mod('squatGob',{eL:[44,68],hL:[34,76],eR:[45,69],hR:[35,77]});
def('jumpTop',[50,6,50,17,50,47,50,71,48,95,53,71,51,95,58,4,64,-8,59,5,65,-7]);
POSE.jumpFwd=shift('jumpTop',18,0);
POSE.boxStart=shift('squatBack',-14,0);
POSE.onBox=shift('standFwd',22,-18);
def('hingeBot',[77,50,68,52,42,58,46,83,44,109,48,83,47,109,68,68,68,83,69,68,69,83]);
POSE.hingeTop=mod('stand',{eL:[51,46],hL:[53,62],eR:[52,46],hR:[54,62]});
POSE.swingBot=mod('hingeBot',{eL:[62,66],hL:[54,80],eR:[63,66],hR:[55,80]});
POSE.swingTop=mod('stand',{eL:[64,38],hL:[78,42],eR:[64,39],hR:[78,43]});
def('dlBot',[70,46,62,50,38,66,56,82,48,109,58,83,50,109,60,66,58,82,61,67,59,83]);
def('splitTop',[50,20,50,31,50,61,40,84,28,108,62,84,66,109,49,46,50,60,51,46,52,60]);
def('splitBot',[50,36,50,47,50,77,38,100,24,106,72,79,72,109,49,62,50,76,51,62,51,76]);

function toPose(a){const o={};J.forEach((k,i)=>o[k]=[a[i*2],a[i*2+1]]);return o}
const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];

function figEls(p,props){
  const L=(a,b,c)=>({t:'line',c,a:{x1:p[a][0],y1:p[a][1],x2:p[b][0],y2:p[b][1]}});
  const els=[];
  const pre=[],post=[];
  (props||[]).forEach(pr=>{
    const [kind,arg]=pr.split('@');const n=arg?arg.split(',').map(Number):[];
    const hm=mid(p.hL,p.hR);
    if(kind==='band')pre.push({t:'line',c:'band',a:{x1:n[0],y1:n[1],x2:hm[0],y2:hm[1]}});
    if(kind==='cable'){pre.push({t:'line',c:'cable',a:{x1:n[0],y1:n[1],x2:hm[0],y2:hm[1]}});pre.push({t:'rect',c:'pulley',a:{x:n[0]-3,y:n[1]-3,width:6,height:6,rx:1.5}})}
    if(kind==='bench')pre.push({t:'rect',c:'furn',a:{x:n[0],y:n[1],width:n[2],height:5,rx:1.5}},{t:'line',c:'ground',a:{x1:n[0]+4,y1:n[1]+5,x2:n[0]+4,y2:110}},{t:'line',c:'ground',a:{x1:n[0]+n[2]-4,y1:n[1]+5,x2:n[0]+n[2]-4,y2:110}});
    if(kind==='box')pre.push({t:'rect',c:'furn',a:{x:n[0],y:n[1],width:n[2],height:n[3],rx:2}});
    if(kind==='bandH')post.push({t:'line',c:'band',a:{x1:p.hL[0],y1:p.hL[1],x2:p.hR[0],y2:p.hR[1]}});
    if(kind==='barH')post.push({t:'line',c:'bar2',a:{x1:p.hL[0]-5,y1:p.hL[1],x2:p.hR[0]+5,y2:p.hR[1]}});
    if(kind==='kb')post.push({t:'circle',c:'ball',a:{cx:hm[0],cy:hm[1]+3,r:4.5}});
    if(kind==='mb')post.push({t:'circle',c:'ball',a:{cx:hm[0],cy:hm[1],r:6.5}});
    if(kind==='bar')post.push({t:'circle',c:'plate',a:{cx:hm[0],cy:hm[1],r:9}});
    if(kind==='db'){post.push({t:'line',c:'wt',a:{x1:p.hL[0]-4,y1:p.hL[1],x2:p.hL[0]+4,y2:p.hL[1]}});post.push({t:'line',c:'wt',a:{x1:p.hR[0]-4,y1:p.hR[1],x2:p.hR[0]+4,y2:p.hR[1]}})}
    if(kind==='db1')post.push({t:'line',c:'wt',a:{x1:p.hR[0]-4,y1:p.hR[1],x2:p.hR[0]+4,y2:p.hR[1]}});
    if(kind==='club'){const dx=p.hR[0]-p.eR[0],dy=p.hR[1]-p.eR[1],l=Math.hypot(dx,dy)||1;post.push({t:'line',c:'club',a:{x1:p.hR[0],y1:p.hR[1],x2:p.hR[0]+dx/l*40,y2:p.hR[1]+dy/l*40}})}
    if(kind==='clubSh'){const dx=p.hR[0]-p.hL[0],dy=p.hR[1]-p.hL[1],l=Math.hypot(dx,dy)||1;post.push({t:'line',c:'club',a:{x1:p.hL[0]-dx/l*10,y1:p.hL[1]-dy/l*10,x2:p.hR[0]+dx/l*10,y2:p.hR[1]+dy/l*10}})}
  });
  els.push(...pre);
  els.push(L('hp','kL','limb bk'),L('kL','fL','limb bk'),L('nk','eL','limb bk'),L('eL','hL','limb bk'));
  els.push(L('nk','hp','torso'),L('nk','hd','torso'));
  els.push(L('hp','kR','limb'),L('kR','fR','limb'),L('nk','eR','limb'),L('eR','hR','limb'));
  els.push({t:'circle',c:'head',a:{cx:p.hd[0],cy:p.hd[1],r:6.5}});
  els.push(...post);
  return els;
}
function figureSVG(ex){
  const A=toPose(POSE[ex.poses[0]]),B=toPose(POSE[ex.poses[1]]);
  const ea=figEls(A,ex.prop),eb=figEls(B,ex.prop);
  const dur=ex.dur||2.6;
  let out='<svg class="fig" viewBox="-6 -14 112 128" xmlns="http://www.w3.org/2000/svg"><line class="ground" x1="-6" y1="110.5" x2="106" y2="110.5"/>';
  ea.forEach((e,i)=>{
    const f=eb[i];let attrs='',anims='';
    for(const k in e.a){
      const va=+e.a[k].toFixed(1),vb=+f.a[k].toFixed(1);
      attrs+=` ${k}="${va}"`;
      if(va!==vb)anims+=`<animate attributeName="${k}" values="${va};${vb};${va}" keyTimes="0;0.5;1" dur="${dur}s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>`;
    }
    out+=`<${e.t} class="${e.c}"${attrs}>${anims}</${e.t}>`;
  });
  return out+'</svg>';
}

function availFor(env,equip){return env==='gym'?['bw','band','db','cable','mb','bar','box','bench']:['bw'].concat(equip||[])}
function capFor(pid){
  if(pid==='warmup')return 99;
  const pr=S.profile||{};
  const base=pr.count||{20:4,30:5,45:6,60:7}[pr.len]||5;
  return pid==='mobility'?Math.min(8,base+2):base;
}
function target(ex,pid,week){
  const lvl=(S.profile&&S.profile.level)||'intermediate';
  let sets=ex.sets,reps=ex.reps,secs=ex.secs,rest=ex.rest;
  if(pid==='warmup')return{sets:1,reps,secs,rest:0};
  if(pid!=='mobility'){
    if(lvl==='beginner')sets=Math.max(2,sets-1);
    if(lvl==='advanced')sets=sets+1;
  }
  if(week>=3&&week<=4){if(secs)secs+=5;else if(pid!=='power')reps+=2}
  if(week===5){sets+=1;if(secs)secs+=10;else if(pid!=='power')reps+=2}
  if(week===6){sets=Math.max(1,sets-1)}
  return{sets,reps,secs,rest};
}
const ckey=(pid,tpl)=>pid+':'+(tpl%PROGRAMS[pid].tpl.length);
function pickExercises(pid,tplIdx,env,equip,ignoreCustom){
  const prog=PROGRAMS[pid];
  const c=!ignoreCustom&&S.custom[ckey(pid,tplIdx)];if(c)return c.filter(id=>EX[id]);
  const avail=availFor(env,equip);
  const lim=(S.profile&&S.profile.limits)||[];
  const used=new Set(),out=[];
  const tpl=prog.tpl[tplIdx%prog.tpl.length];
  for(const slot of tpl){
    const id=slot.find(i=>{const e=EX[i];return e&&!used.has(i)&&e.req.every(r=>avail.includes(r))&&!e.avoid.some(a=>lim.includes(a))});
    if(id){used.add(id);out.push(id)}
    if(out.length>=capFor(pid))break;
  }
  return out;
}

/* ---------- plans ---------- */
function makePlan(pid,env,equip,days,time,start){
  const sessions=[];const s=pkey(start);let n=0;
  for(let i=0;i<WEEKS*7;i++){
    const d=addDays(s,i);
    if(days.includes(d.getDay())){sessions.push({date:dkey(d),week:Math.floor(i/7)+1,tpl:n%PROGRAMS[pid].tpl.length,done:null});n++}
  }
  return{id:uid(),pid,env,equip,days,time,start,sessions,created:Date.now()};
}
const nextSession=p=>p.sessions.findIndex(x=>!x.done);
const planOf=pid=>S.plans.find(p=>p.pid===pid);
function planWeek(p){const i=nextSession(p);return i<0?WEEKS:p.sessions[i].week}

/* ---------- day status ---------- */
function dayStatus(k){
  if(S.logs.some(l=>l.date===k))return'done';
  const t=todayKey();let sched=false,missed=false;
  for(const p of S.plans)for(const s of p.sessions){
    if(s.date!==k)continue;sched=true;
    if(k<t&&(!s.done||s.done>k))missed=true;
  }
  if(missed)return'missed';
  if(sched&&k>=t)return'planned';
  return'';
}

/* ---------- calendar export ---------- */
function icsStamp(k,time,addMin){
  const d=pkey(k);const[h,m]=time.split(':').map(Number);d.setHours(h,m+(addMin||0),0,0);
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
}
function estMin(pid){const n=Math.min(capFor(pid),PROGRAMS[pid].tpl[0].length);return pid==='mobility'?Math.max(15,n*3):Math.max(25,n*7)}
function upcoming(p){const t=todayKey();return p.sessions.filter(s=>!s.done&&s.date>=t)}
function sessionTitle(p,s){const pr=PROGRAMS[p.pid];return`Golf ${pr.short}: Week ${s.week}, Workout ${'ABC'[s.tpl]}`}
function buildICS(p){
  const len=estMin(p.pid);
  const now=new Date();const stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+'00Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Swing Fit//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Golf workouts'];
  upcoming(p).forEach((s,i)=>{
    L.push('BEGIN:VEVENT','UID:'+p.id+'-'+s.date+'@swingfit','DTSTAMP:'+stamp,'DTSTART:'+icsStamp(s.date,p.time),'DTEND:'+icsStamp(s.date,p.time,len),'SUMMARY:'+sessionTitle(p,s),'DESCRIPTION:Open Swing Fit and tap Start workout.','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Golf workout','TRIGGER:-PT15M','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function addApple(p){
  if(!upcoming(p).length){toast('No upcoming workouts to add');return}
  const blob=new Blob([buildICS(p)],{type:'text/calendar'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!ios)a.download='golf-'+p.pid+'-plan.ics';
  a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function addGoogle(p){
  const up=upcoming(p);if(!up.length){toast('No upcoming workouts to add');return}
  const len=estMin(p.pid);const f=up[0];
  const rr='RRULE:FREQ=WEEKLY;BYDAY='+p.days.slice().sort().map(d=>ICSDAY[d]).join(',')+';COUNT='+up.length;
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Vancouver';
  const u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Golf '+PROGRAMS[p.pid].short+' workout')+'&dates='+icsStamp(f.date,p.time)+'/'+icsStamp(f.date,p.time,len)+'&ctz='+encodeURIComponent(tz)+'&recur='+encodeURIComponent(rr)+'&details='+encodeURIComponent('Open Swing Fit and tap Start workout.');
  window.open(u,'_blank');
}

let Q={i:0,a:{}};
function startQuiz(){Q={i:0,a:S.profile?JSON.parse(JSON.stringify(S.profile)):{time:'07:00',limits:[]}};if(!Q.a.time)Q.a.time='07:00';if(!Q.a.limits)Q.a.limits=[];renderQuiz()}
function renderQuiz(){
  const q=QS[Q.i],v=Q.a[q.k];
  let body='';
  if(q.t==='text'||q.t==='number')body=`<input class="field" id="qf" ${q.t==='number'?'type="number" inputmode="decimal"':'type="text" autocomplete="given-name"'} placeholder="${q.ph||''}" value="${esc(v==null?'':v)}">`;
  if(q.t==='time')body=`<input class="field" id="qf" type="time" value="${esc(v||'07:00')}">`;
  if(q.t==='single'||q.t==='multi')body=q.o.map(o=>{
    const on=q.t==='multi'?((v||[]).includes(o[0])||(o[0]==='none'&&v&&v.length===0&&Q.a['_t'+q.k])):v===o[0];
    return`<button class="opt ${on?'on':''}" data-act="qopt" data-v="${o[0]}"><b>${o[1]}</b>${o[2]?`<span>${o[2]}</span>`:''}</button>`}).join('');
  const canNext=q.t==='single'?v!=null:q.t==='multi'?Q.a['_t'+q.k]:(q.opt||String(v||'').trim()!=='');
  app.innerHTML=`<div class="quiz">
    <div class="row"><button class="p-x" data-act="qback" style="visibility:${Q.i?'visible':'hidden'}">&#8249;</button><div class="sp bar"><i style="width:${(Q.i+1)/QS.length*100}%"></i></div><span class="small muted">${Q.i+1}/${QS.length}</span></div>
    ${Q.i===0&&!S.profile?'<div class="tag" style="margin-top:28px;color:var(--green)">Swing Fit</div><div class="muted" style="margin-top:6px">A few quick questions so your programs fit you.</div>':''}
    <h2 class="qtitle">${q.q}</h2>${q.sub?`<p class="muted" style="margin-top:-8px">${q.sub}</p>`:''}
    <div>${body}</div><div class="sp"></div>
    <button class="btn" data-act="qnext" ${canNext?'':'disabled'} style="margin-top:20px">${Q.i===QS.length-1?'Finish':(q.opt&&!v?'Skip':'Next')}</button>
  </div>`;
  const f=document.getElementById('qf');
  if(f){f.addEventListener('input',()=>{Q.a[q.k]=q.t==='number'?(f.value===''?'':Number(f.value)):f.value;const b=app.querySelector('[data-act=qnext]');const ok=q.opt||String(f.value).trim()!=='';b.disabled=!ok;if(q.opt)b.textContent=f.value?'Next':'Skip'});if(q.t!=='time')setTimeout(()=>f.focus(),50)}
}
function quizAct(act,el){
  const q=QS[Q.i];
  if(act==='qopt'){
    let v=el.dataset.v;const o=q.o.find(x=>String(x[0])===v);v=o[0];
    if(q.t==='single'){Q.a[q.k]=v;renderQuiz();setTimeout(()=>quizAct('qnext'),180);return}
    let arr=Q.a[q.k]||[];Q.a['_t'+q.k]=true;
    if(v==='none')arr=[];else arr=arr.includes(v)?arr.filter(x=>x!==v):arr.concat(v);
    Q.a[q.k]=arr;renderQuiz();return;
  }
  if(act==='qback'){do{Q.i--}while(Q.i>0&&QS[Q.i].when&&!QS[Q.i].when(Q.a));Q.i=Math.max(0,Q.i);renderQuiz();return}
  if(act==='qnext'){
    if(q.t==='time'&&!Q.a.time)Q.a.time='07:00';
    let j=Q.i+1;while(j<QS.length&&QS[j].when&&!QS[j].when(Q.a))j++;
    if(j<QS.length){Q.i=j;if(QS[j].t==='multi'&&Q.a[QS[j].k])Q.a['_t'+QS[j].k]=true;renderQuiz();return}
    const p=Object.assign({},Q.a);Object.keys(p).forEach(k=>{if(k[0]==='_')delete p[k]});p.name=String(p.name||'').trim();if(p.env!=='home')p.equip=[];delete p.len;
    const fresh=!S.profile;S.profile=p;save();tab='today';render();

}

function suggestFor(id,tg,week){
  const e=EX[id];if(!e.w)return null;const le=lastEntry(id);if(!le)return null;
  const w=Math.max(0,...le.sets.map(s=>s.lbs||0));if(!w)return null;
  const inc=e.req.includes('bar')?10:5,need=le.tg||tg;
  const hit=le.sets.length>=Math.min(need.sets,tg.sets)&&le.sets.every(s=>need.secs?(s.secs||0)>=need.secs:(s.reps||0)>=need.reps);
  if(week===6)return{lbs:w,msg:'Light week. Stay at '+w+' lb or drop a little.'};
  if(!tg.secs&&!need.secs&&tg.reps>need.reps)return{lbs:w,msg:'Reps go up this week. Stay at '+w+' lb.'};
  if(hit)return{lbs:w+inc,up:true,msg:'Go up '+inc+' lb. You hit every rep last time.'};

function shiftForRounds(){
  const t=todayKey(),moves=[],RD=new Set(S.rounds);
  const bad=k=>RD.has(k)||RD.has(dkey(addDays(pkey(k),1)));
  S.plans.forEach(p=>{if(!['strength','power'].includes(p.pid))return;
    p.sessions.forEach(s=>{if(s.done||s.date<t||!bad(s.date))return;
      const taken=k=>S.plans.some(q=>q.sessions.some(x=>x!==s&&x.date===k));
      for(const off of [-1,1,-2,2,-3,3]){const k=dkey(addDays(pkey(s.date),off));if(k<t||bad(k)||taken(k))continue;moves.push(PROGRAMS[p.pid].short+': '+fmtDate(s.date)+' to '+fmtDate(k));s.date=k;break}
    })});
  return moves;
}

function bstats(){
  const L=S.logs,wk=k=>{const x=pkey(k);x.setDate(x.getDate()-x.getDay());return dkey(x)};
  const wc={};L.forEach(l=>{const k=wk(l.date);wc[k]=(wc[k]||0)+1});
  let streak=0,run=0,prev=null;Object.keys(wc).sort().forEach(k=>{run=(prev&&dkey(addDays(pkey(prev),7))===k)?run+1:1;streak=Math.max(streak,run);prev=k});
  const vol=l=>l.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.lbs||0)*(s.reps||0),0),0);
  const vols=L.map(vol);const all=S.plans.concat(S.archive);
  const fin=all.filter(p=>p.sessions.length&&p.sessions.every(s=>s.done));
  const perfect=all.some(p=>{const w={};p.sessions.forEach(s=>{(w[s.week]=w[s.week]||[]).push(s)});return Object.values(w).some(a=>a.length>=2&&a.every(s=>s.done&&s.done===s.date))});
  return{n:L.length,maxWeek:Math.max(0,...Object.values(wc)),streak,perfect,
    prs:L.reduce((a,l)=>a+l.ex.filter(e=>e.sets.some(s=>s.pr)).length,0),
    lb:id=>Math.max(0,...L.flatMap(l=>l.ex.filter(e=>e.id===id).flatMap(e=>e.sets.map(s=>s.lbs||0)))),
    maxVol:Math.max(0,...vols),totVol:vols.reduce((a,b)=>a+b,0),
    warm:L.filter(l=>l.pid==='warmup').length,ready:L.some(l=>l.pid==='warmup'&&S.rounds.includes(l.date)),
    progs:new Set(L.map(l=>l.pid).filter(p=>p&&p!=='warmup')).size,
    grad:fin.length>0,hio:fin.some(p=>p.sessions.every(s=>s.done<=s.date)),
    early:L.some(l=>new Date(l.start).getHours()<7),
    mull:L.some(l=>dayStatus(dkey(addDays(pkey(l.date),-1)))==='missed')};
}
function checkBadges(){

/* ---------- progress ---------- */
function series(id){const e=EX[id],out=[];S.logs.forEach(l=>l.ex.forEach(x=>{if(x.id===id&&x.sets.length)out.push({date:l.date,v:Math.max(...x.sets.map(s=>metric(e,s))),pr:x.sets.some(s=>s.pr),sets:x.sets})}));return out}
function spark(pts,w,h){if(pts.length<2)return'';const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn||1;
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="#3fd47a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p,i)=>(2+i*(w-4)/(pts.length-1)).toFixed(1)+','+(h-3-(p.v-mn)/r*(h-6)).toFixed(1)).join(' ')}"/></svg>`}
function viewProg(){
  const earned=BADGES.filter(b=>S.badges[b.id]).length;
  let h=`<h1>Progress</h1><div class="row" style="margin:16px 0 0"><h3 class="sp">Badges</h3><span class="muted small">${earned} of ${BADGES.length}</span></div>
  <div class="bgrid">${BADGES.map(b=>`<button class="bd ${S.badges[b.id]?'':'lock'}" data-act="badge" data-v="${b.id}"><span class="medal" style="--c:${b.c}">${glyph(b.g)}</span><span class="bn">${b.name}</span></button>`).join('')}</div>
  <h3>Your lifts</h3>`;
  const ids=[];for(let i=S.logs.length-1;i>=0;i--)S.logs[i].ex.forEach(e=>{if(!ids.includes(e.id)&&EX[e.id])ids.push(e.id)});
  if(!ids.length)h+='<p class="muted">Log a workout and your exercises show up here with a chart of your progress.</p>';
  h+=ids.map(id=>{const e=EX[id],pts=series(id),best=Math.max(...pts.map(p=>p.v)),last=pts[pts.length-1].v,u=unitOf(e);
    return`<button class="list-btn" data-act="lift" data-v="${id}" style="padding:12px 14px"><div class="sp"><b>${esc(e.name)}</b><div class="small muted">Best ${best} ${u} · last ${last} ${u}</div></div>${spark(pts.slice(-10),70,26)}<span class="chev">&#8250;</span></button>`}).join('');
  return h;
}
function openLift(id){
  const e=EX[id],pts=series(id),u=unitOf(e);
  const W=330,H=180,pl=34,pr=12,pt=14,pb=26;
  const vs=pts.map(p=>p.v);let mn=Math.min(...vs),mx=Math.max(...vs);if(mn===mx){mn=Math.max(0,mn-5);mx=mx+5}
  const X=i=>pts.length<2?(pl+W-pr)/2:pl+i*(W-pl-pr)/(pts.length-1),Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const line=pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ');
  const svg=`<svg viewBox="0 0 ${W} ${H}">
    ${[mn,(mn+mx)/2,mx].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#24322a"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#8a9c91">${Math.round(v)}</text>`).join('')}
    ${pts.length>1?`<polygon points="${X(0)},${H-pb} ${line} ${X(pts.length-1)},${H-pb}" fill="#3fd47a" opacity=".12"/><polyline points="${line}" fill="none" stroke="#3fd47a" stroke-width="2.5" stroke-linejoin="round"/>`:''}
    ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="${p.pr?5:3.5}" fill="${p.pr?'#f5c84c':'#3fd47a'}" stroke="#131b16" stroke-width="2"/>`).join('')}
    <text x="${pl}" y="${H-6}" font-size="11" fill="#8a9c91">${fmtDate(pts[0].date)}</text>${pts.length>1?`<text x="${W-pr}" y="${H-6}" font-size="11" fill="#8a9c91" text-anchor="end">${fmtDate(pts[pts.length-1].date)}</text>`:''}
  </svg>`;
  const best=Math.max(...vs);
  sheet(`<h2>${esc(e.name)}</h2><p class="muted" style="margin:4px 0 0">Best ${best} ${u} · ${pts.length} session${pts.length===1?'':'s'}</p>
  <div class="chart">${svg}</div><div class="small muted" style="margin:-4px 0 10px"><span style="color:var(--yellow)">&#9679;</span> personal best</div>
  ${pts.slice(-8).reverse().map(p=>`<div class="hist-ex"><div class="row"><b class="sp">${fmtDate(p.date)}</b>${p.pr?'<span class="pill" style="color:var(--yellow);border-color:#5a4a15">PB</span>':''}</div><div class="small muted">${p.sets.map(s=>s.secs?s.secs+'s':((s.reps||0)+(s.lbs?' x '+s.lbs+' lb':''))).join(' · ')}</div></div>`).join('')}
  <button class="btn ghost" style="margin-top:14px" data-act="close">Close</button>`);
}

let pendingAsk=null;

function onClick(ev){
  const el=ev.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,v=el.dataset.v;
  if(act==='closebg'){if(ev.target===el){PV=null;closeSheet()}return}

    case'pexit':exitPlayer();break;
    case'discard':S.active=null;restEnd=0;cd=null;save();{const p=document.querySelector('.player');if(p)p.remove()}closeSheet();render();break;
  }
}
document.addEventListener('click',onClick);
document.addEventListener('pointerdown',()=>{try{if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)()}else if(actx.state==='suspended')actx.resume()}catch(e){}},{once:false,passive:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(S.active&&navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{});if(!S.active)render()}});

checkBadges();
render();
/* ---------- auto update ----------
   The service worker checks for a new version every time the app opens or comes back to the front.
   When one is ready it reloads, unless a workout is in progress (then it waits until you save). */
let updateWaiting=false;
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claudeusercontent|claude\.ai/.test(location.host)){
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    const check=()=>reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
    setInterval(check,30*60*1000);
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController)return;
    if(S.active){updateWaiting=true;return}
    location.reload();
  });
}
</script>
