# Deploys Swing Fit to GitHub Pages on every push to main.
# Stamps the build id into sw.js and index.html so installed phones update themselves.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build id
        run: |
          BUILD="$(date -u +%Y%m%d.%H%M)-${GITHUB_SHA::7}"
          mkdir -p _site
          cp index.html sw.js manifest.json icon-192.png icon-512.png apple-touch-icon.png _site/
          sed -i "s/__BUILD__/${BUILD}/g" _site/index.html _site/sw.js
          echo "Build $BUILD"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
